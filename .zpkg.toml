[package]
org = "fiducia"
name = "fiducia-sync"
version = "0.2.0"
description = "Local-first Rust, WebAssembly, browser, Flutter, PostgreSQL, and Supabase synchronization for Fiducia"
license = "MIT"
keywords = ["sync", "offline-first", "wasm", "postgres", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-sync"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/Cargo.toml\" && test -f \"$ZED_PKG_TEST_TARGET/sdk/package.json\" && test -f \"$ZED_PKG_TEST_TARGET/dart/pubspec.yaml\" && test -f \"$ZED_PKG_TEST_TARGET/crates/postgres/Cargo.toml\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/.dart_tool/**", "sdk/pkg/**"]

# The root Rust/WASM core owns the complete repository artifact. Its separate
# Postgres crate and client runtimes keep isolated release roots below it.
[targets.rust]
dir = "."
adapter = "rust"

[targets.rust-postgres]
dir = "crates/postgres"
name = "fiducia-sync-postgres"
adapter = "rust"
ecosystem = "cargo"

[targets.nodejs]
dir = "sdk"
adapter = "node"

[targets.nodejs.native]
registry = "npm"
package = "@fiducia/sync"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.dart]
dir = "dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "fiducia_sync"

[targets.sql]
dir = "sql"
adapter = "none"

[targets.schema]
dir = "schema"
adapter = "none"

[scripts]
test = "cargo test --workspace --all-targets --locked && npm --prefix sdk test"
