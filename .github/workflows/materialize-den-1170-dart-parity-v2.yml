name: Materialize DEN-1170 Dart outcome parity v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/materialize-den-1170-dart-parity-v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-den-1170-dart-parity-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1170-dart-outcome-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1170-dart-outcome-parity
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Execute the reviewed materializer with a structural factory matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/materialize-den-1170-dart-parity.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('reviewed Dart materializer markers are not unique')
          raw = source.split(start, 1)[1].split(end, 1)[0]
          lines = raw.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected Dart materializer indentation')
          code = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          code = code.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)

          old_section = re.compile(
              r"\nfactory_anchor = '''.*?"
              r"models\.write_text\(text\.replace\(factory_anchor, factory_replacement, 1\), encoding='utf-8'\)\n",
              re.DOTALL,
          )
          replacement = r'''
          factory_pattern = re.compile(
              r"  factory SyncWritePolicy\.fromJson\(Map<String, Object\?> json\) =>\n"
              r"      SyncWritePolicy\(\n"
              r"        strategy: SyncWriteStrategy\.fromWire\(json\['strategy'\]\),\n"
              r"        failureMode: SyncFailureMode\.fromWire\(json\['failure_mode'\]\),\n"
              r"        telemetry: SyncTelemetryLevel\.fromWire\(json\['telemetry'\]\),\n"
              r"      \);\n"
          )
          factory_replacement = (
              "  factory SyncWritePolicy.fromJson(Map<String, Object?> json) =>\n"
              "      SyncWritePolicy(\n"
              "        strategy: SyncWriteStrategy.fromWire(json['strategy']),\n"
              "        failureMode: SyncFailureMode.fromWire(json['failure_mode']),\n"
              "        telemetry: SyncTelemetryLevel.fromWire(json['telemetry']),\n"
              "      ).validate();\n"
          )
          if len(factory_pattern.findall(text)) != 1:
              raise SystemExit('SyncWritePolicy.fromJson structural matcher did not match exactly once')
          text = factory_pattern.sub(factory_replacement, text, count=1)
          models.write_text(text, encoding='utf-8')
          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          ) + '\n'
          code, substitutions = old_section.subn('\n' + replacement, code, count=1)
          if substitutions != 1:
              raise SystemExit('failed to replace the reviewed factory matcher')
          exec(compile(code, '<den-1170-dart-materializer-v2>', 'exec'), {})
          PY

          git rm \
            .github/workflows/materialize-den-1170-dart-parity.yml \
            .github/workflows/materialize-den-1170-dart-parity-v2.yml
          cd dart
          flutter pub get
          dart format lib/src/client.dart lib/src/models.dart lib/src/telemetry.dart test/client_test.dart test/telemetry_test.dart
          flutter analyze
          flutter test
          cd ..
          git add \
            dart/README.md \
            dart/lib/src/client.dart \
            dart/lib/src/models.dart \
            dart/lib/src/telemetry.dart \
            dart/test/client_test.dart \
            dart/test/telemetry_test.dart
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -v '^.github/workflows/' | sort | paste -sd ' ' -)" = "dart/README.md dart/lib/src/client.dart dart/lib/src/models.dart dart/lib/src/telemetry.dart dart/test/client_test.dart dart/test/telemetry_test.dart"

      - name: Commit the canonical Dart product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(DEN-1170): align Dart outcome observability'
          git push origin HEAD:refs/heads/agent/den-1170-dart-outcome-parity
