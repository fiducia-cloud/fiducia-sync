name: Materialize DEN-1170 Dart outcome parity v3

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/materialize-den-1170-dart-parity-v3.yml

permissions:
  contents: write

concurrency:
  group: materialize-den-1170-dart-parity-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1170-dart-outcome-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1170-dart-outcome-parity
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Execute the reviewed v2 materializer with literal replacement bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/materialize-den-1170-dart-parity-v2.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('reviewed Dart v2 materializer markers are not unique')
          raw = source.split(start, 1)[1].split(end, 1)[0]
          lines = raw.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected Dart v2 materializer indentation')
          code = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          old = "code, substitutions = old_section.subn('\\n' + replacement, code, count=1)"
          new = "code, substitutions = old_section.subn(lambda _: '\\n' + replacement, code, count=1)"
          if code.count(old) != 1:
              raise SystemExit('v2 replacement call did not match exactly once')
          code = code.replace(old, new, 1)
          exec(compile(code, '<den-1170-dart-materializer-v3>', 'exec'), {})
          PY

          git rm \
            .github/workflows/materialize-den-1170-dart-parity.yml \
            .github/workflows/materialize-den-1170-dart-parity-v2.yml \
            .github/workflows/materialize-den-1170-dart-parity-v3.yml
          cd dart
          flutter pub get
          dart format lib/src/client.dart lib/src/models.dart lib/src/telemetry.dart test/client_test.dart test/telemetry_test.dart
          flutter analyze
          flutter test
          cd ..
          git add \
            dart/README.md \
            dart/lib/src/client.dart \
            dart/lib/src/models.dart \
            dart/lib/src/telemetry.dart \
            dart/test/client_test.dart \
            dart/test/telemetry_test.dart
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -v '^.github/workflows/' | sort | paste -sd ' ' -)" = "dart/README.md dart/lib/src/client.dart dart/lib/src/models.dart dart/lib/src/telemetry.dart dart/test/client_test.dart dart/test/telemetry_test.dart"

      - name: Commit the canonical Dart product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(DEN-1170): align Dart outcome observability'
          git push origin HEAD:refs/heads/agent/den-1170-dart-outcome-parity
