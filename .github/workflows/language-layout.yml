name: Language layout contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  language-layout:
    name: language-layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify canonical language collections
        run: python3 tests/test_language_layout.py
