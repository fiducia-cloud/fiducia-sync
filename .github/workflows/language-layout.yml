name: Language layout contract
on:
  pull_request:
  push:
    branches: [main, 'validation/langs-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  language-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test adversarial fixtures
        run: cargo test --locked --manifest-path tools/language-layout/Cargo.toml
      - name: Audit repository layout
        run: cargo run --locked --manifest-path tools/language-layout/Cargo.toml
