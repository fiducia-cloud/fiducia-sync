name: opto-sync adapter resilience

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'opto-sync-adapter.json'
      - 'tests/e2e/test_opto_sync_adapter_resilience.py'
      - '.github/workflows/opto-sync-adapter-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run wrapper-boundary and fail-closed provenance tests
        run: python3 -m unittest tests/e2e/test_opto_sync_adapter_resilience.py -v
