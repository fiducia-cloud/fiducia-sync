name: Zed package contract

on:
  pull_request:
    paths:
      - .github/workflows/zed-package.yml
      - .zpkg.lock
      - .zpkg.toml
      - Cargo.toml
      - langs/rust/postgres/Cargo.toml
      - langs/dart/pubspec.yaml
      - docs/zed-package.md
      - schema/**
      - langs/typescript/package.json
      - langs/typescript/tests/client.test.mjs
      - sql/**
      - tools/zpkg-contract.test.mjs
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REV: 9b8e5f3d3b98845436899b9a8645f3ce19689f85

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/zed-package.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.1"

      - name: Static package-contract tests
        run: node --test tools/zpkg-contract.test.mjs

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"

      - name: Install the canonical Zed CLI revision
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/zed-pkg/zed-cli \
            --rev "${ZED_CLI_REV}" \
            --locked \
            --root "${RUNNER_TEMP}/zed-cli"
          echo "${RUNNER_TEMP}/zed-cli/bin" >> "${GITHUB_PATH}"

      - name: Canonical Zed release plan is deterministic
        run: |
          set -euo pipefail
          zed release plan --json > "${RUNNER_TEMP}/release-plan-a.json"
          zed release plan --json > "${RUNNER_TEMP}/release-plan-b.json"
          cmp "${RUNNER_TEMP}/release-plan-a.json" "${RUNNER_TEMP}/release-plan-b.json"

      - name: Inspect exact Zed, native, and forge artifacts
        env:
          PLAN: ${{ runner.temp }}/release-plan-a.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path(os.environ["PLAN"]).read_text())
          assert plan["release_set"] == "fiducia/fiducia-sync@0.2.0#v0.2.0", plan
          assert plan["source"] == {
              "package": "fiducia/fiducia-sync",
              "version": "0.2.0",
              "vcs_tag": "v0.2.0",
              "repository": "https://github.com/fiducia-cloud/fiducia-sync",
          }, plan["source"]

          expected_zed = [
              {"target": "dart", "package": "fiducia/fiducia-sync-flutter", "version": "0.2.0", "dir": "langs/dart"},
              {"target": "nodejs", "package": "fiducia/fiducia-sync-sdk", "version": "0.2.0", "dir": "langs/typescript"},
              {"target": "rust", "package": "fiducia/fiducia-sync-core", "version": "0.2.0", "dir": "."},
              {"target": "rust-postgres", "package": "fiducia/fiducia-sync-postgres", "version": "0.2.0", "dir": "langs/rust/postgres"},
              {"target": "schema", "package": "fiducia/fiducia-sync-schema", "version": "0.2.0", "dir": "schema"},
              {"target": "sql", "package": "fiducia/fiducia-sync-sql", "version": "0.2.0", "dir": "sql"},
          ]
          assert plan["zed"] == expected_zed, plan["zed"]

          expected_native = [
              {"target": "dart", "registry": "pub.dev", "package": "fiducia_sync", "version": "0.2.0", "vcs_tag": "v0.2.0", "dir": "langs/dart"},
              {"target": "nodejs", "registry": "npm", "package": "@fiducia/sync", "version": "0.2.0", "vcs_tag": "v0.2.0", "dir": "langs/typescript"},
          ]
          assert plan["native"] == expected_native, plan["native"]
          assert all(route["target"] not in {"rust", "rust-postgres"} for route in plan["native"]), plan["native"]

          expected_forge = [
              {"target": "nodejs", "registry": "github-packages", "format": "npm", "package": "@fiducia/sync", "version": "0.2.0", "vcs_tag": "v0.2.0", "dir": "langs/typescript"},
          ]
          assert plan["forge"] == expected_forge, plan["forge"]
          PY
