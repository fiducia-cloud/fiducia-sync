name: Formal wave 3
on:
  pull_request:
    paths: ['conformance/**', '.github/workflows/formal-wave3.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  bounded-model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python3 conformance/replay_sequence_model.py
