name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned ores-sops
        env:
          ORES_SOPS_COMMIT: 51b97aa0be5c12947224c1d983519ed8a4a6e11c
          ORES_SOPS_BLOB: e746935e85b5c9ff2869f63bb7191dfecf46328c
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ores-sops \
            "https://raw.githubusercontent.com/ORESoftware/ores-sops/${ORES_SOPS_COMMIT}/ores-sops"
          actual_blob="$(git hash-object /tmp/ores-sops)"
          test "${actual_blob}" = "${ORES_SOPS_BLOB}" || {
            printf 'ores-sops blob mismatch: expected %s, got %s\n' \
              "${ORES_SOPS_BLOB}" "${actual_blob}" >&2
            exit 1
          }
          sudo install -m 0755 /tmp/ores-sops /usr/local/bin/ores-sops
          ores-sops --version

      - name: Install just
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: just env-check
        run: just env-check
